<!doctype html>
<html lang="en" data-theme="mocha">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1e2e" />
    <title>Fala</title>
    <meta name="description" content="Fala is a working front-end for SoundCloud." />
    <!--
      Bitmap icons come first, and an .ico sits beside them. Android builds a
      home-screen shortcut's icon from the bitmap favicon path, not from the
      SVG, so an SVG-only declaration left it with nothing to use and the
      launcher fell back to a letter drawn from the hostname. The SVG stays
      last for browsers that prefer it in the tab.
    -->
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Installability: Android/Chrome read the manifest, iOS reads the touch icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fala" />
    <meta name="application-name" content="Fala" />
    <!-- Track titles and usernames often contain digit runs; stop iOS linking them. -->
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem('fala.theme');
        var legacy = localStorage.getItem('wf.theme');
        if (saved === null && legacy !== null) {
          saved = legacy;
          localStorage.setItem('fala.theme', legacy);
          localStorage.removeItem('wf.theme');
        }
        if (saved === 'light' || saved === 'dark' || saved === 'mocha') {
          document.documentElement.dataset.theme = saved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta)
            meta.setAttribute(
              'content',
              saved === 'light' ? '#ffffff' : saved === 'mocha' ? '#1e1e2e' : '#0c0c0e'
            );
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
