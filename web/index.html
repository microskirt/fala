<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" />
    <title>Fala</title>
    <meta name="description" content="Fala is a calmer front-end for SoundCloud." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem('fala.theme');
        var legacy = localStorage.getItem('wf.theme');
        if (saved === null && legacy !== null) {
          saved = legacy;
          localStorage.setItem('fala.theme', legacy);
          localStorage.removeItem('wf.theme');
        }
        if (saved === 'light' || saved === 'dark' || saved === 'mocha') {
          document.documentElement.dataset.theme = saved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta)
            meta.setAttribute(
              'content',
              saved === 'light' ? '#ffffff' : saved === 'mocha' ? '#1e1e2e' : '#0c0c0e'
            );
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
